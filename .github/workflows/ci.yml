name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly: run the slow (real HuggingFace download + graph build) tests against current upstream packages.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ scripts/
      - name: Preset tables are in sync
        run: python scripts/render_preset_tables.py --check
      - name: Type check
        if: matrix.python-version == '3.12'
        run: pyright src/
      - name: Unit tests
        run: pytest tests/ -v -m "not slow and not integration"

  gotui:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gotui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gotui/go.mod
          cache-dependency-path: gotui/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Wheel version matches onnx2oracle.__version__
        run: |
          pip install dist/*.whl --no-deps
          python - <<'PY'
          import importlib.metadata as md
          import pathlib
          import re

          init = pathlib.Path("src/onnx2oracle/__init__.py").read_text()
          declared = re.search(r'^__version__ = "([^"]+)"', init, re.M).group(1)
          assert md.version("onnx2oracle") == declared, (md.version("onnx2oracle"), declared)
          PY

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache HuggingFace downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.onnx2oracle/cache
          key: hf-slow-${{ hashFiles('src/onnx2oracle/presets.py') }}
          restore-keys: hf-slow-
      - name: Install (CPU torch for the reranker export path)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,export]"
      - name: Slow tests
        run: pytest tests/test_pipeline.py -v -m slow
